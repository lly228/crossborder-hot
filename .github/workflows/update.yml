name: 更新资讯数据

on:
  schedule:
    # UTC 22:15 = 北京 06:15，UTC 09:15 = 北京 17:15
    - cron: "15 22 * * *"
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取资讯
        run: python scripts/fetch_news.py

      - name: LLM加工（配了密钥才跑）
        env:
          CBHOT_LLM_API_KEY: ${{ secrets.CBHOT_LLM_API_KEY }}
          CBHOT_LLM_BASE_URL: ${{ vars.CBHOT_LLM_BASE_URL }}
          CBHOT_LLM_MODEL: ${{ vars.CBHOT_LLM_MODEL }}
        run: |
          if [ -n "$CBHOT_LLM_API_KEY" ]; then
            python scripts/enrich_llm.py
          else
            echo "未配置 CBHOT_LLM_API_KEY，跳过LLM加工"
          fi

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "自动更新资讯数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
